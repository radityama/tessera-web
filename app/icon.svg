<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .t-fill { fill: #201d1d; }
    .t-frame { fill: none; stroke: #201d1d; stroke-width: 3; }
    .t-open-fill { fill: none; }
    .t-open-stroke { fill: none; stroke: #646262; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .t-fill { fill: #fdfcfc; }
      .t-frame { stroke: #fdfcfc; }
      .t-open-fill { fill: none; }
      .t-open-stroke { stroke: #8a8787; }
    }
  </style>
  <rect class="t-frame" x="4" y="4" width="56" height="56"/>
  <rect class="t-fill" x="12" y="12" width="18" height="18"/>
  <rect class="t-fill" x="34" y="12" width="18" height="18"/>
  <rect class="t-fill" x="12" y="34" width="18" height="18"/>
  <rect class="t-open-fill" x="34" y="34" width="18" height="18"/>
  <rect class="t-open-stroke" x="34" y="34" width="18" height="18"/>
</svg>
